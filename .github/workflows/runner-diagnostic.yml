name: GitHub Pages preview — build validation

on:
  push:
    branches: [github-pages-preview]

permissions:
  contents: read

jobs:
  validate-preview-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate API syntax
        run: npm run check:api

      - name: Run tests
        run: npm test

      - name: Build GitHub Pages preview
        run: npm run build
        env:
          VITE_GITHUB_PAGES: "true"
