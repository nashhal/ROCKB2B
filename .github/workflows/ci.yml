name: ROCK B2B checks

on:
  push:
    branches: [main, demo-v1, backend-v1]
  pull_request:
    branches: [main, demo-v1, backend-v1]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check API syntax
        run: npm run check:api
      - name: Test catalogue and account data
        run: npm test
      - name: Build web app
        run: npm run build