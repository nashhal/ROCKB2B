name: ROCK B2B demo checks

on:
  push:
    branches: [demo-v1]
  pull_request:
    branches: [main, demo-v1]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web demo
        run: npm run build